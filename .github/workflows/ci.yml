# Quality gates for every contribution. Runs on PRs (including from forks —
# no secrets are used here) and on pushes to the integration branches.
# Preview deployments are handled separately by the Vercel Git integration:
# every push to `develop` / authorized PR gets its own preview URL.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck & build (web, serverless, desktop bundle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build web + serverless bundle
        run: npm run build:vercel
      - name: Build desktop server + MCP bundle
        run: npm run desktop:build
      - name: Server tests (security, features, Azure, diff)
        run: node tests/run.cjs

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    # Production dependencies must be free of high/critical advisories — this
    # is a real gate. Dev-only tooling is reported but doesn't fail the build
    # (and doesn't paint the branch red the way continue-on-error did).
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Production dependencies (blocking)
        run: npm audit --omit=dev --audit-level=high
      - name: All dependencies (report only)
        run: npm audit --audit-level=high || true
